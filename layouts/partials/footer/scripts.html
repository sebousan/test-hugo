<script>
const hash = window.location.hash.substring(1); // enlève le #
const params = new URLSearchParams(hash);
const token = params.get("invite_token");

console.log(hash);
console.log(params);
console.log(token);
https://hugolify-test.netlify.app/#invite_token=Bv4tmz2LU8gtbz5gs3dFWQ
if (token) {
  console.log("identity");
  fetch("/.netlify/identity/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token })
  })
  .then(res => res.json())
  .then(data => {
    console.log(data);

    if (data.access_token) {
      // Stocker les infos en session (pas recommandé en localStorage pour la sécurité)
      sessionStorage.setItem("user", JSON.stringify(data.user));
      sessionStorage.setItem("access_token", data.access_token);
      sessionStorage.setItem("refresh_token", data.refresh_token);

      console.log("Utilisateur connecté :", data.user);

      // Rediriger vers une page protégée par exemple
      {{/*  window.location.href = "/restricted/";  */}}
    } else {
      console.error("Échec de la vérification :", data);
    }
  });
}
</script>
